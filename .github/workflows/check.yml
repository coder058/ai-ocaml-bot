name: OCaml and monitor checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '4.14'
      - run: opam install yojson dune -y
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest --force
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research/requirements.txt cryptography
      - name: Synthetic paper routing and connection boundaries
        run: |
          python -m unittest discover -s test -p test_multi_paper_runtime.py -v
          python -m unittest discover -s test -p test_stock_paper_runtime.py -v
          python -m unittest discover -s test -p test_oanda_practice.py -v
          python -m unittest discover -s test -p test_stock_capture.py -v
          python -m unittest discover -s test -p test_paper_order_capture.py -v
          python -m unittest discover -s test -p test_export_telemetry.py -v
          python -m unittest discover -s test -p test_sync_local_monitor.py -v
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
